<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - Class Market</title>
    <link rel="stylesheet" href="./css/teladoADm.css">
</head>
<body>

    <nav class="navbar">
        <h1>Class Market - ADM</h1>
    </nav>

    <main class="container">

        <section class="cards-info">
            <div class="card-info">
                <h2>12</h2>
                <p>Produtos Pendentes</p>
            </div>

            <div class="card-info">
                <h2>58</h2>
                <p>Produtos Aprovados</p>
            </div>

            <div class="card-info">
                <h2>35</h2>
                <p>Usuários</p>
            </div>
        </section>

        <h2 class="titulo">Produtos Pendentes</h2>

        <section class="produtos">

            <div class="produto-card">
                <h3>Brownie de Chocolate</h3>
                <p>Preço: R$ 5,00</p>
                <p>Vendedor: João Silva</p>

                <div class="acoes">
                    <button class="aprovar">Aprovar</button>
                    <button class="rejeitar">Rejeitar</button>
                </div>
            </div>

            <div class="produto-card">
                <h3>Trufa</h3>
                <p>Preço: R$ 3,00</p>
                <p>Vendedor: Maria Souza</p>

                <div class="acoes">
                    <button class="aprovar">Aprovar</button>
                    <button class="rejeitar">Rejeitar</button>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
