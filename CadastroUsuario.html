<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Class Market</title>
    <link rel="stylesheet" href="./css/CadastroUsuario.css">
</head>
<body>

     <nav class="navbar">
        
    <a href="./home.html" class="btn-voltar">
        ← Ver outros produtos
    </a>


    <p id="logo">Class Market</p>

</nav>

    <div class="container">

        <h1>Crie sua conta</h1>

        <form id="cadastroForm">

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" maxlength="120" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" maxlength="190" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="curso">Curso/Turma</label>
                <input type="text" id="curso" placeholder="Ex: Informática">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" minlength="8" maxlength="128" required>
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar Senha</label>
                <input type="password" id="confirmar" placeholder="Digite novamente" minlength="8" maxlength="128" required>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

        <p class="login">
            Já possui conta?
            <a href="./loginUsuario.html">Entrar</a>
        </p>

    </div>
    <script src="./js/database.js"></script>
    <script src="./js/cadastroUsuario.js"></script>

</body>
</html>
