<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avaliações — Classmarket</title>
  <link rel="stylesheet" href="./css/avaliacao.css"/>
</head>
<body>

<nav>
  <a href="./home.html">← Início</a>
  <span class="brand">CLASSMARKET</span>
  <span></span>
</nav>

<div class="container">

  <h1>Avaliações</h1>
  <p class="sub">Deixe sua opinião sobre o site ou sobre um produto.</p>

  <div class="card">
    <h2>Avaliar o Site</h2>

    <label>Nota</label>
    <div class="estrelas">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span> 
    </div>

    <label>Seu nome (opcional)</label>
    <input type="text" placeholder="Ex: João"/>

    <label>Comentário (opcional)</label>
    <textarea rows="3" placeholder="O que você achou do Classmarket?"></textarea>

    <button>Enviar</button>
  </div>

  <div class="card">
    <h2>Avaliar Produto</h2>

    <label>Nota</label>
    <div class="estrelas">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>

    <label>Produto</label>
    <select>
      <option value="">Selecione...</option>
      <option>Barra de Chocolate</option>
      <option>Cesta de Doces</option>
      <option>Outro</option>
    </select>

    <label>Comentário (opcional)</label>
    <textarea rows="3" placeholder="Gostou? Tem sugestões?"></textarea>

    <button>Enviar</button>
  </div>

</div>

<footer>
  <strong>CLASSMARKET</strong> — © 2026 — Instituto Fucapi
</footer>

</body>
</html>
