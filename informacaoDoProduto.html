<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="./css/informa_produto.css">
</head>
<body>

    <nav class="navbar">
        
    <a href="./home.html" class="btn-voltar">
        ← Ver outros produtos
    </a>


    <p id="logo">Class Market</p>

</nav>

    <div class="container">

        <div class="produto">
            <img id="produtoImagem" src="" alt="Produto">

            <div class="info">
                <h1 id="produtoNome">Produto</h1>

                <p class="preco" id="produtoPreco"></p>

                <h3>Descrição</h3>
                <p id="produtoDescricao"></p>

                <h3>Vendedor</h3>
                <p id="produtoVendedor">Aluno vendedor</p>

                <h3>Localização</h3>
                <p id="produtoLocal"></p>

                <h3>Avaliação</h3>
                <p id="produtoEstoque"></p>

                <button id="contatoButton">Entrar em Contato</button>
            </div>
            <script src="./js/database.js"></script>
            <script src="./js/informacaoProduto.js"></script>
        </div>

    </div>

</body>
</html>
